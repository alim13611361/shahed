plugins {
    id 'com.android.application'
}

android {
    namespace 'com.madaraneh24.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.madaraneh24.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // نیازی به کتابخانه اضافه نیست، وب‌ویو نیتیو اندروید استفاده میشه
}
